# Central DSP — Prometheus для compose (profile monitoring).
# Цели — по именам сервисов compose; /metrics у обоих без auth, поэтому порты
# наружу не публикуются (см. compose.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: bidder-go
    metrics_path: /metrics
    static_configs:
      - targets: ["bidder-go:8090"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
