# Central DSP — Prometheus для compose (profile monitoring).
# Цели — по именам сервисов compose; /metrics у обоих без auth, поэтому порты
# наружу не публикуются (см. compose.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Alertmanager того же profile monitoring (audit C4b / N-02); дальше алерты
# идут в backend /alerts/webhook — см. ops/alertmanager/alertmanager.yml.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ["scheduler:8001"]

  - job_name: bidder-go
    metrics_path: /metrics
    static_configs:
      - targets: ["bidder-go:8090"]

  # Ресурсы хоста (audit O-05): node-exporter поднимается тем же profile
  # monitoring, порт наружу не публикуется, только внутренняя сеть compose.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
