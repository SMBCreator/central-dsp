# Alembic configuration for Central DSP
# Run: alembic -c backend/db/alembic.ini upgrade head

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40
version_locations = %(here)s/migrations/versions

# SQLAlchemy URL is injected from env.py via DATABASE_URL env var
# sqlalchemy.url = set dynamically in env.py

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
