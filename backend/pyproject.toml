[project]
name = "centraldsp-backend"
version = "1.0.0"
description = "CentralDSP management API + OpenRTB 2.5 bidder"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.1,<0.142",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "bcrypt>=4.2.0",
    "pydantic>=2.9.0",
    "email-validator>=2.2.0",
]

# This is an application, not a library: disable package discovery so
# `pip install ./backend` installs only the dependencies.
[tool.setuptools]
packages = []
