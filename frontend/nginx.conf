# Map: forward Upgrade only if the client actually sent one.
# For normal HTTP requests $http_upgrade is empty → Connection stays "close".
# For real WebSocket requests $http_upgrade is "websocket" → Connection: "upgrade".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ─────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Auth endpoints proxy ─────────────────────
    location /auth/ {
        proxy_pass         http://backend:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Backend API proxy ─────────────────────────
    # Upgrade/Connection passed ONLY when client sends WebSocket handshake.
    # Regular REST calls (GET /api/rtb/campaigns etc.) get Connection: close
    # so uvicorn never attempts a WebSocket upgrade → no WARNING spam.
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400s;
    }

    # ── Tracking / SmartLink proxy ────────────────
    location ~ ^/(s|c|track|px|postback|health)(/|$) {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Java Bidder proxy ─────────────────────────
    location /bidder/ {
        proxy_pass         http://bidder:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 5s;
    }
}
