# Map: forward Upgrade only if the client actually sent one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker embedded DNS — resolve upstreams lazily at request time, not at startup.
# This prevents nginx from crashing when bidder/backend are still booting.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ─────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Auth via /api/auth/* → backend /auth/* ─────
    location /api/auth/ {
        set $backend_upstream http://backend:8000;
        proxy_pass         $backend_upstream/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           "";
        proxy_set_header   Connection        close;
        proxy_read_timeout 30s;
    }

    # ── RTB endpoints → backend ──
    location /api/rtb/ {
        set $backend_upstream http://backend:8000;
        proxy_pass         $backend_upstream/api/rtb/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           "";
        proxy_set_header   Connection        close;
        proxy_read_timeout 10s;
    }

    # ── All other /api/* (WebSocket allowed for live stats) ──
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass         $backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400s;
    }

    # ── Legacy /auth/ (direct calls without /api/ prefix) ──
    location /auth/ {
        set $backend_upstream http://backend:8000;
        proxy_pass         $backend_upstream/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           "";
        proxy_set_header   Connection        close;
        proxy_read_timeout 30s;
    }

    # ── Tracking / SmartLink proxy ────────────────
    location ~ ^/(s|c|track|px|postback|health)(/|$) {
        set $backend_upstream http://backend:8000;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Java Bidder proxy ─────────────────────────
    location /bidder/ {
        set $bidder_upstream http://bidder:8080;
        proxy_pass         $bidder_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 5s;
    }
}
