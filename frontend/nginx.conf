# Map: forward Upgrade only if the client actually sent one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker embedded DNS — resolve upstreams lazily at request time, not at startup.
# Using set $var + proxy_pass $var (host only, no path) avoids URI duplication.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ──────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Auth: /api/auth/* → backend /auth/*
    #    rewrite strips /api prefix so backend sees /auth/login, /auth/me etc.
    location /api/auth/ {
        set $backend http://backend:8000;
        rewrite ^/api/auth/(.*)$ /auth/$1 break;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           "";
        proxy_set_header   Connection        close;
        proxy_read_timeout 30s;
    }

    # ── RTB: /api/rtb/* → backend /api/rtb/*
    #    proxy_pass host-only — nginx forwards the full URI unchanged.
    location /api/rtb/ {
        set $backend http://backend:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           "";
        proxy_set_header   Connection        close;
        proxy_read_timeout 10s;
    }

    # ── All other /api/* (WebSocket allowed for live stats)
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400s;
    }

    # ── Legacy /auth/* (direct calls without /api/ prefix)
    location /auth/ {
        set $backend http://backend:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           "";
        proxy_set_header   Connection        close;
        proxy_read_timeout 30s;
    }

    # ── Tracking / SmartLink proxy ────────────────────────
    location ~ ^/(s|c|track|px|postback|health)(/|$) {
        set $backend http://backend:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Java Bidder: /bidder/* → bidder:8080/*
    #    rewrite strips /bidder prefix so bidder sees /ortb, /health etc.
    location /bidder/ {
        set $bidder http://bidder:8080;
        rewrite ^/bidder/(.*)$ /$1 break;
        proxy_pass         $bidder;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 5s;
    }
}
