# Map: forward Upgrade only if the client actually sent one.
# For normal HTTP requests $http_upgrade is empty → Connection stays "close".
# For real WebSocket requests $http_upgrade is "websocket" → Connection: "upgrade".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ─────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Auth via /api/auth/* → backend /auth/* ─────
    # Frontend calls /api/auth/login and /api/auth/me,
    # but FastAPI registers routes as /auth/login and /auth/me.
    # Strip the /api prefix here so they match.
    location /api/auth/ {
        proxy_pass         http://backend:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── All other /api/* → backend /api/* ────────
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400s;
    }

    # ── Legacy /auth/ block (kept for any direct calls) ──
    location /auth/ {
        proxy_pass         http://backend:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Tracking / SmartLink proxy ────────────────
    location ~ ^/(s|c|track|px|postback|health)(/|$) {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Java Bidder proxy ─────────────────────────
    location /bidder/ {
        proxy_pass         http://bidder:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 5s;
    }
}
