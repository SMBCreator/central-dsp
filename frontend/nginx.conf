# Map: forward Upgrade only if the client actually sent one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ─────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Auth via /api/auth/* → backend /auth/* ─────
    location /api/auth/ {
        proxy_pass         http://backend:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           "";
        proxy_set_header   Connection        close;
        proxy_read_timeout 30s;
    }

    # ── RTB endpoints — NO WebSocket upgrade (bidder uses plain HTTP) ──
    location /api/rtb/ {
        proxy_pass         http://backend:8000/api/rtb/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Explicitly clear WS headers — bidder Java WebClient adds Upgrade by default
        proxy_set_header   Upgrade           "";
        proxy_set_header   Connection        close;
        proxy_read_timeout 10s;
    }

    # ── All other /api/* (WebSocket allowed for live stats) ──
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400s;
    }

    # ── Legacy /auth/ (direct calls without /api/ prefix) ──
    location /auth/ {
        proxy_pass         http://backend:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           "";
        proxy_set_header   Connection        close;
        proxy_read_timeout 30s;
    }

    # ── Tracking / SmartLink proxy ────────────────
    location ~ ^/(s|c|track|px|postback|health)(/|$) {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Java Bidder proxy ─────────────────────────
    location /bidder/ {
        proxy_pass         http://bidder:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 5s;
    }
}
