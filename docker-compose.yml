version: '3.9'

services:

  # ─────────────────────────────────────────
  # DATABASE
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-centraldsp}
      POSTGRES_USER: ${POSTGRES_USER:-centraldsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-centraldsp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # REDIS (broker + cache + RTB counters)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # BACKEND (FastAPI — Campaign API + RTB Bridge)
  # ─────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RTB_API_TOKEN: ${RTB_API_TOKEN:?set RTB_API_TOKEN in .env (openssl rand -hex 32)}
      # Автопроверка SSP из кабинета бьёт в боевой Go-биддер по HTTP
      # (ssp_check.go_bidder_caller). Тот же RTB_API_TOKEN подписывает запрос.
      BIDDER_URL: ${BIDDER_URL:-http://bidder-go:8090}
      # Consumer событий Go-биддера (rtb:events -> bid_events/stats_hourly);
      # RTB_EVENTS_CONSUMER=0 выключает (например, на реплике backend'а).
      RTB_EVENTS_CONSUMER: ${RTB_EVENTS_CONSUMER:-1}
      # Файлы креативов (баннеры/видео) — на именованном volume, чтобы не
      # терялись при пересборке контейнера. См. docs/DEPLOYMENT.md §5.1.
      UPLOAD_DIR: /data/uploads
      MAX_IMAGE_UPLOAD_BYTES: ${MAX_IMAGE_UPLOAD_BYTES:-2097152}    # 2 МБ
      MAX_VIDEO_UPLOAD_BYTES: ${MAX_VIDEO_UPLOAD_BYTES:-52428800}   # 50 МБ
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app                        # hot reload dev
      - geoip_data:/data:ro                   # GeoLite2 DB (read-only)
      - uploads_data:/data/uploads            # креативы (persistent)
    ports:
      - "8000:8000"
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # CENTRALBIDDER (Java OpenRTB 2.5 Engine)
  # DEPRECATED: заменяется bidder-go (см. docs/audit/go_bidder_plan.md).
  # Оставлен как reference до cutover; новые фичи сюда не добавляются.
  # ─────────────────────────────────────────
  bidder:
    build: ./bidder
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CAMPAIGN_MANAGER_URL: http://backend:8000/api/rtb
      BID_FLOOR: ${RTB_DEFAULT_BID_FLOOR:-0.01}
      MAX_BID: ${RTB_MAX_BID_PRICE:-5.00}
      RESPONSE_TIMEOUT: ${RTB_RESPONSE_TIMEOUT_MS:-100}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - geoip_data:/data:ro                   # GeoLite2 DB
    ports:
      - "8080:8080"                           # OpenRTB endpoint
      - "9090:9090"                           # Prometheus metrics
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # BIDDER-GO (Go OpenRTB 2.5 Engine) — основной трек.
  # Скелет: включается профилем `--profile bidder-go` до прохождения
  # contract-тестов и shadow-режима (docs/audit/go_bidder_plan.md).
  # ─────────────────────────────────────────
  bidder-go:
    build: ./bidder-go
    profiles: ["bidder-go"]
    restart: unless-stopped
    environment:
      BIDDER_ADDR: ":8090"
      BACKEND_INTERNAL_URL: http://backend:8000
      REDIS_URL: ${REDIS_URL_BIDDER:-redis://redis:6379/0}
      RTB_API_TOKEN: ${RTB_API_TOKEN:?set RTB_API_TOKEN in .env}
      EVENT_TOKEN_SECRET: ${EVENT_TOKEN_SECRET:?set EVENT_TOKEN_SECRET in .env (openssl rand -hex 32)}
      EVENT_BASE_URL: ${PUBLIC_BASE_URL:-http://backend:8000}
      APP_ENV: ${APP_ENV:-production}
      INTERNAL_FEED_TOKEN: ${INTERNAL_FEED_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # CELERY WORKER
  # ─────────────────────────────────────────
  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=4 -Q default,rtb,sync
    env_file: .env
    environment:
      RTB_API_TOKEN: ${RTB_API_TOKEN:?set RTB_API_TOKEN in .env (openssl rand -hex 32)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # CELERY BEAT (scheduler)
  # ─────────────────────────────────────────
  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - worker
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # FLOWER (Celery monitoring)
  # ─────────────────────────────────────────
  flower:
    build: ./backend
    restart: unless-stopped
    command: celery -A celery_app flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?set FLOWER_PASSWORD in .env}
    env_file: .env
    ports:
      - "127.0.0.1:5555:5555"   # loopback only; use an SSH tunnel or reverse proxy with auth
    depends_on:
      - worker
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # FRONTEND (Next.js admin UI)
  # В проде /api/* проксируется на backend реверс-прокси (nginx/caddy),
  # см. docs/DEPLOYMENT.md.
  # ─────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Штатно /api/* до Next.js не доходит (Caddy -> backend:8000). Если всё же
      # дошёл — проксируем в backend по сети compose, а не в 127.0.0.1 контейнера.
      # Mock-fallback в production-сборке выключен; ALLOW_MOCK_FALLBACK=1 включает осознанно.
      BACKEND_INTERNAL_URL: http://backend:8000
      ALLOW_MOCK_FALLBACK: ${ALLOW_MOCK_FALLBACK:-0}
    depends_on:
      - backend
    networks:
      - centraldsp

volumes:
  postgres_data:
  uploads_data:          # файлы креативов (баннеры/видео); бэкапить вместе с БД
  geoip_data:            # Mount your GeoLite2-City.mmdb here in production
                         # docker run --rm -v centraldsp_geoip_data:/data alpine
                         # wget -O /data/GeoLite2-City.mmdb <maxmind_url>

networks:
  centraldsp:
    name: centraldsp-network
    driver: bridge
