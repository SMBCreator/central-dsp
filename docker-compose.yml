version: '3.9'

services:

  # ─────────────────────────────────────────
  # DATABASE
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-centraldsp}
      POSTGRES_USER: ${POSTGRES_USER:-centraldsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-centraldsp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # REDIS (broker + cache)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # BACKEND (FastAPI)
  # ─────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app  # hot reload in dev
    ports:
      - "8000:8000"

  # ─────────────────────────────────────────
  # RTB4FREE BIDDER (Java)
  # ─────────────────────────────────────────
  bidder:
    build: ./bidder
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CAMPAIGN_MANAGER_URL: http://backend:8000/api/rtb
      BID_FLOOR: ${RTB_DEFAULT_BID_FLOOR:-0.01}
      MAX_BID: ${RTB_MAX_BID_PRICE:-5.00}
      RESPONSE_TIMEOUT: ${RTB_RESPONSE_TIMEOUT_MS:-100}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────
  # CELERY WORKER
  # ─────────────────────────────────────────
  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=4 -Q default,rtb,sync
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────
  # CELERY BEAT (scheduler)
  # ─────────────────────────────────────────
  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      - worker

  # ─────────────────────────────────────────
  # FLOWER (Celery monitoring UI)
  # ─────────────────────────────────────────
  flower:
    build: ./backend
    restart: unless-stopped
    command: celery -A celery_app flower --port=5555 --basic_auth=admin:admin123
    env_file: .env
    ports:
      - "5555:5555"
    depends_on:
      - worker

  # ─────────────────────────────────────────
  # FRONTEND (Vue 3 + nginx)
  # ─────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  default:
    name: centraldsp-network
