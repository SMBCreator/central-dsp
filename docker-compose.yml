version: '3.9'

services:

  # ─────────────────────────────────────────
  # DATABASE
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-centraldsp}
      POSTGRES_USER: ${POSTGRES_USER:-centraldsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-centraldsp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # REDIS (broker + cache + RTB counters)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # BACKEND (FastAPI — Campaign API + RTB Bridge)
  # ─────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RTB_API_TOKEN: ${RTB_API_TOKEN:?set RTB_API_TOKEN in .env (openssl rand -hex 32)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app                        # hot reload dev
      - geoip_data:/data:ro                   # GeoLite2 DB (read-only)
    ports:
      - "8000:8000"
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # CENTRALBIDDER (Java OpenRTB 2.5 Engine)
  # ─────────────────────────────────────────
  bidder:
    build: ./bidder
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CAMPAIGN_MANAGER_URL: http://backend:8000/api/rtb
      BID_FLOOR: ${RTB_DEFAULT_BID_FLOOR:-0.01}
      MAX_BID: ${RTB_MAX_BID_PRICE:-5.00}
      RESPONSE_TIMEOUT: ${RTB_RESPONSE_TIMEOUT_MS:-100}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - geoip_data:/data:ro                   # GeoLite2 DB
    ports:
      - "8080:8080"                           # OpenRTB endpoint
      - "9090:9090"                           # Prometheus metrics
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # CELERY WORKER
  # ─────────────────────────────────────────
  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=4 -Q default,rtb,sync
    env_file: .env
    environment:
      RTB_API_TOKEN: ${RTB_API_TOKEN:?set RTB_API_TOKEN in .env (openssl rand -hex 32)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # CELERY BEAT (scheduler)
  # ─────────────────────────────────────────
  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - worker
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # FLOWER (Celery monitoring)
  # ─────────────────────────────────────────
  flower:
    build: ./backend
    restart: unless-stopped
    command: celery -A celery_app flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?set FLOWER_PASSWORD in .env}
    env_file: .env
    ports:
      - "127.0.0.1:5555:5555"   # loopback only; use an SSH tunnel or reverse proxy with auth
    depends_on:
      - worker
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # FRONTEND (Vue 3 + nginx)
  # ─────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - centraldsp

volumes:
  postgres_data:
  geoip_data:            # Mount your GeoLite2-City.mmdb here in production
                         # docker run --rm -v centraldsp_geoip_data:/data alpine
                         # wget -O /data/GeoLite2-City.mmdb <maxmind_url>

networks:
  centraldsp:
    name: centraldsp-network
    driver: bridge
