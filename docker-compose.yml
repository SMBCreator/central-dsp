version: '3.9'

services:

  # ─────────────────────────────────────────
  # DATABASE
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-centraldsp}
      POSTGRES_USER: ${POSTGRES_USER:-centraldsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-centraldsp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # REDIS
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # BACKEND (FastAPI)
  # ─────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RTB_API_TOKEN: ${RTB_API_TOKEN:-changeme-rtb-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - geoip_data:/data:ro
    ports:
      - "8777:8000"
    # Healthcheck: /health returns {"status":"ok"} once FastAPI is fully up
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # CENTRALBIDDER (Java OpenRTB 2.5)
  # ─────────────────────────────────────────
  bidder:
    build: ./bidder
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CAMPAIGN_MANAGER_URL: http://backend:8000/api/rtb
      BID_FLOOR: ${RTB_DEFAULT_BID_FLOOR:-0.01}
      MAX_BID: ${RTB_MAX_BID_PRICE:-5.00}
      RESPONSE_TIMEOUT: ${RTB_RESPONSE_TIMEOUT_MS:-100}
    depends_on:
      redis:
        condition: service_healthy
      # Wait for backend to be fully up — prevents null ConnectException on @PostConstruct
      backend:
        condition: service_healthy
    volumes:
      - geoip_data:/data:ro
    ports:
      - "8778:8080"
      - "9779:9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health | grep -qE 'ok|starting'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # CELERY WORKER
  # ─────────────────────────────────────────
  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=4 -Q default,rtb,sync
    env_file: .env
    environment:
      RTB_API_TOKEN: ${RTB_API_TOKEN:-changeme-rtb-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping --destination celery@$$HOSTNAME -t 5 2>&1 | grep -q pong"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # CELERY BEAT
  # ─────────────────────────────────────────
  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      worker:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # FLOWER
  # ─────────────────────────────────────────
  flower:
    build: ./backend
    restart: unless-stopped
    command: >
      celery -A celery_app flower
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin123}
      --broker_api=redis://redis:6379/0
      --inspect_timeout=10000
      --persistent=True
      --db=/tmp/flower.db
    env_file: .env
    ports:
      - "8780:5555"
    depends_on:
      worker:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - centraldsp

  # ─────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8779:80"
    # Wait for backend — prevents nginx 502 on first requests
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - centraldsp

volumes:
  postgres_data:
  geoip_data:

networks:
  centraldsp:
    name: centraldsp-network
    driver: bridge
