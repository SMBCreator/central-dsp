name: CI

on:
  push:
    branches: [main, central-dsp, "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dsp
          POSTGRES_PASSWORD: dsp
          POSTGRES_DB: dsp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dsp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dsp:dsp@localhost:5432/dsp_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install ./backend pytest pytest-asyncio httpx "fakeredis[lua]" pyyaml
      - name: Apply migrations to a fresh database
        run: python backend/migrate.py
      - name: Migrations are idempotent on re-run
        run: python backend/migrate.py
      - name: Backend imports cleanly
        working-directory: backend
        run: python -c "import main"
      - name: Byte-compile all backend sources
        run: python -m compileall -q backend
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: No broken UTF-8 (U+FFFD) in source
        run: |
          set -o pipefail
          if grep -rIn $'\xEF\xBF\xBD' frontend/app frontend/components frontend/lib backend bidder-go docs ops --include='*.ts' --include='*.tsx' --include='*.py' --include='*.sql' --include='*.go' --include='*.md' --include='*.yml' --include='*.yaml' --include='*.conf' --include='*.sh'; then
            echo "::error::Found U+FFFD replacement characters (broken encoding) in source files above"
            exit 1
          fi
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit
      - name: Unit tests (route handlers, audit S-05)
        working-directory: frontend
        run: pnpm test
      - name: Build
        working-directory: frontend
        run: pnpm run build

  bidder-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bidder-go/go.mod
          cache-dependency-path: bidder-go/go.sum
      - name: Vet
        working-directory: bidder-go
        run: go vet ./...
      - name: Build
        working-directory: bidder-go
        run: go build ./...
      - name: Test
        working-directory: bidder-go
        run: go test ./...

  # Блок G аудита: известные уязвимости в зависимостях всех трёх слоёв.
  # Порог — high/critical (pnpm), любая известная (pip-audit, govulncheck —
  # он показывает только реально вызываемые из нашего кода функции).
  # Audit O-01: compose-топология валидируется на каждом push — dev, production
  # (Caddy/TLS) и managed-БД варианты, Caddyfile и Prometheus-конфиг.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (dev)
        run: docker compose -f compose.yml --env-file .env.example config -q
      - name: docker compose config (dev + monitoring)
        run: docker compose -f compose.yml --env-file .env.example --profile monitoring config --services | grep -qx prometheus
      - name: docker compose config (production)
        run: docker compose -f compose.yml -f compose.prod.yml --env-file .env.example config -q
      - name: docker compose config (managed Postgres/Redis)
        run: |
          grep -v '^POSTGRES_PASSWORD' .env.example > /tmp/env.ext
          cat .env.external.example >> /tmp/env.ext
          docker compose --env-file /tmp/env.ext config -q
          ! docker compose --env-file /tmp/env.ext config --services | grep -qx postgres
      - name: production closes internal ports and dev bind-mount
        run: |
          docker compose -f compose.yml -f compose.prod.yml --env-file .env.example config --format json > /tmp/prod.json
          python3 - <<'PY'
          import json
          s = json.load(open('/tmp/prod.json'))['services']
          for n in ('backend', 'bidder-go', 'frontend'):
              assert not s[n].get('ports'), f'{n} must not publish ports in production'
          assert all(v.get('type') != 'bind' for v in s['backend'].get('volumes', [])), 'backend must not bind-mount source in production'
          assert 'caddy' in s and 'celery' not in open('compose.yml').read()
          PY
      - name: caddy validate
        run: |
          docker run --rm -e DOMAIN=dsp.example.com -e ACME_EMAIL=ops@example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: promtool check config
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (backend runtime deps)
        run: |
          pip install -q pip-audit
          python -c "import tomllib; print('\n'.join(tomllib.load(open('backend/pyproject.toml','rb'))['project']['dependencies']))" > /tmp/backend-reqs.txt
          pip-audit --strict --desc off -r /tmp/backend-reqs.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: pnpm audit (frontend prod deps, high+)
        working-directory: frontend
        run: pnpm audit --audit-level high --prod

      - uses: actions/setup-go@v5
        with:
          go-version-file: bidder-go/go.mod
          cache-dependency-path: bidder-go/go.sum
      - name: govulncheck (bidder-go, reachable vulns only)
        working-directory: bidder-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
