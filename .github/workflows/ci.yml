name: CI

on:
  push:
    branches: [main, central-dsp, "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dsp
          POSTGRES_PASSWORD: dsp
          POSTGRES_DB: dsp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dsp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dsp:dsp@localhost:5432/dsp_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install ./backend pytest pytest-asyncio httpx "fakeredis[lua]"
      - name: Apply migrations to a fresh database
        run: python backend/migrate.py
      - name: Migrations are idempotent on re-run
        run: python backend/migrate.py
      - name: Backend imports cleanly
        working-directory: backend
        run: python -c "import main"
      - name: Byte-compile all backend sources
        run: python -m compileall -q backend
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: No broken UTF-8 (U+FFFD) in source
        run: |
          set -o pipefail
          if grep -rIn $'\xEF\xBF\xBD' frontend/app frontend/components frontend/lib backend/routers backend/*.py backend/migrations --include='*.ts' --include='*.tsx' --include='*.py' --include='*.sql'; then
            echo "::error::Found U+FFFD replacement characters (broken encoding) in source files above"
            exit 1
          fi
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit
      - name: Build
        working-directory: frontend
        run: pnpm run build

  bidder-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: bidder-go/go.sum
      - name: Vet
        working-directory: bidder-go
        run: go vet ./...
      - name: Build
        working-directory: bidder-go
        run: go build ./...
      - name: Test
        working-directory: bidder-go
        run: go test ./...
