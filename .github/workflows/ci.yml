name: CI

on:
  push:
    branches: [main, central-dsp, "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dsp
          POSTGRES_PASSWORD: dsp
          POSTGRES_DB: dsp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dsp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dsp:dsp@localhost:5432/dsp_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install ./backend pytest pytest-asyncio httpx "fakeredis[lua]" pyyaml
      - name: Apply migrations to a fresh database
        run: python backend/migrate.py
      - name: Migrations are idempotent on re-run
        run: python backend/migrate.py
      - name: Backend imports cleanly
        working-directory: backend
        run: python -c "import main"
      - name: Byte-compile all backend sources
        run: python -m compileall -q backend ops/lib/http_probe.py
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: No broken UTF-8 (U+FFFD) in source
        run: |
          set -o pipefail
          if grep -rIn $'\xEF\xBF\xBD' frontend/app frontend/components frontend/lib backend bidder-go docs ops --include='*.ts' --include='*.tsx' --include='*.py' --include='*.sql' --include='*.go' --include='*.md' --include='*.yml' --include='*.yaml' --include='*.conf' --include='*.sh'; then
            echo "::error::Found U+FFFD replacement characters (broken encoding) in source files above"
            exit 1
          fi
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit
      - name: Unit tests (route handlers, audit S-05)
        working-directory: frontend
        run: pnpm test
      - name: Build
        working-directory: frontend
        run: pnpm run build

  bidder-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bidder-go/go.mod
          cache-dependency-path: bidder-go/go.sum
      - name: Vet
        working-directory: bidder-go
        run: go vet ./...
      - name: Build
        working-directory: bidder-go
        run: go build ./...
      - name: Test
        working-directory: bidder-go
        run: go test ./...

  # Блок G аудита: известные уязвимости в зависимостях всех трёх слоёв.
  # Порог — high/critical (pnpm), любая известная (pip-audit, govulncheck —
  # он показывает только реально вызываемые из нашего кода функции).
  # Audit O-01: compose-топология валидируется на каждом push — dev, production
  # (Caddy/TLS) и managed-БД варианты, Caddyfile и Prometheus-конфиг.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (dev)
        run: docker compose -f compose.yml --env-file .env.example config -q
      - name: docker compose config (dev + monitoring)
        run: |
          docker compose -f compose.yml --env-file .env.example --profile monitoring config --services > /tmp/mon.services
          grep -qx prometheus /tmp/mon.services && grep -qx node-exporter /tmp/mon.services && grep -qx alertmanager /tmp/mon.services
          # Без профиля monitoring ни Prometheus, ни node-exporter (host mounts), ни Alertmanager не стартуют.
          ! docker compose -f compose.yml --env-file .env.example config --services | grep -qxE 'prometheus|node-exporter|alertmanager'
      - name: docker compose config (production)
        run: docker compose -f compose.yml -f compose.prod.yml --env-file .env.example config -q
      - name: docker compose config (managed Postgres/Redis)
        run: |
          grep -v '^POSTGRES_PASSWORD' .env.example > /tmp/env.ext
          cat .env.external.example >> /tmp/env.ext
          docker compose --env-file /tmp/env.ext config -q
          ! docker compose --env-file /tmp/env.ext config --services | grep -qx postgres
      - name: production closes internal ports and dev bind-mount
        run: |
          docker compose -f compose.yml -f compose.prod.yml --env-file .env.example config --format json > /tmp/prod.json
          python3 - <<'PY'
          import json
          s = json.load(open('/tmp/prod.json'))['services']
          for n in ('backend', 'bidder-go', 'frontend'):
              assert not s[n].get('ports'), f'{n} must not publish ports in production'
          assert all(v.get('type') != 'bind' for v in s['backend'].get('volumes', [])), 'backend must not bind-mount source in production'
          assert 'caddy' in s and 'celery' not in open('compose.yml').read()
          PY
      - name: caddy validate
        run: |
          docker run --rm -e DOMAIN=dsp.example.com -e ACME_EMAIL=ops@example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: promtool check config
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
      # Unit-тесты правил на сериях с реальными job/instance (audit O-05):
      # ловят правила, которые из-за label mismatch никогда не срабатывают.
      - name: promtool test rules
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v2.55.1 test rules /etc/prometheus/alerts_test.yml
      - name: drill override renders isolated (own network, own volumes, _ci database)
        env:
          COMPOSE_PROJECT_NAME: centraldsp-ci-config
        run: |
          docker compose -f compose.yml -f ops/tests/compose.ci-drill.yml --env-file ops/tests/drill.env config --format json > /tmp/drill.json
          python3 - <<'PY'
          import json
          c = json.load(open('/tmp/drill.json'))
          assert c['name'] == 'centraldsp-ci-config'
          assert all(v['name'].startswith('centraldsp-ci-config_') for v in c['volumes'].values()), c['volumes']
          assert all(n['name'].startswith('centraldsp-ci-config-') for n in c['networks'].values()), c['networks']
          assert c['services']['postgres']['environment']['POSTGRES_DB'].endswith('_ci')
          assert c['services']['postgres']['ports'][0]['host_ip'] == '127.0.0.1'
          PY
      - name: shellcheck ops scripts
        run: |
          sudo apt-get install -y -q shellcheck >/dev/null
          shellcheck -x -S warning ops/backup.sh ops/restore.sh ops/lib/backup_common.sh ops/tests/backup_restore_drill.sh ops/preprod_check.sh ops/tests/preprod_check_test.sh
      # preprod_check.sh против подставных docker/curl: вердикты, exit codes 0/1/2/3,
      # цепочка NOT TESTED, отсутствие мутирующих команд (аудит O-04).
      - name: preprod_check.sh contract tests
        run: ops/tests/preprod_check_test.sh

  # Disaster-recovery drill (C2 / audit O-02): изолированный compose-проект,
  # migrations -> seed -> backup.sh --with-redis (VERIFY=always) -> проверка
  # manifest/checksums -> negative tests -> down -v -> restore.sh -> независимая
  # финансовая сверка -> tamper -> verification FAILED. Guard внутри скрипта:
  # CENTRALDSP_TEST_MODE=1 и COMPOSE_PROJECT_NAME=centraldsp-ci-*, иначе exit 3
  # до любых destructive действий. Production .env/секреты не читаются.
  backup-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CENTRALDSP_TEST_MODE: "1"
      COMPOSE_PROJECT_NAME: centraldsp-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install drill dependencies (asyncpg for migrate.py / seed)
        run: pip install asyncpg
      - name: Run drill
        run: ops/tests/backup_restore_drill.sh
      - name: Upload drill report (logs, manifest, artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-restore-drill-report
          path: /tmp/cdsp-drill-*/report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove test stack (belt and braces; the drill already does this in its trap)
        if: always()
        run: docker compose -f compose.yml -f ops/tests/compose.ci-drill.yml --env-file ops/tests/drill.env down -v --remove-orphans || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (backend runtime deps)
        run: |
          pip install -q pip-audit
          python -c "import tomllib; print('\n'.join(tomllib.load(open('backend/pyproject.toml','rb'))['project']['dependencies']))" > /tmp/backend-reqs.txt
          pip-audit --strict --desc off -r /tmp/backend-reqs.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: pnpm audit (frontend prod deps, high+)
        working-directory: frontend
        run: pnpm audit --audit-level high --prod

      - uses: actions/setup-go@v5
        with:
          go-version-file: bidder-go/go.mod
          cache-dependency-path: bidder-go/go.sum
      - name: govulncheck (bidder-go, reachable vulns only)
        working-directory: bidder-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
