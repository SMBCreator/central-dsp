name: CI

on:
  push:
    branches: [main, central-dsp, "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Тот же major, что в compose.yml и на VPS (C6): CI не должен проверять
        # код на PostgreSQL, которого нет в production.
        image: postgres:15.19-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
        env:
          POSTGRES_USER: dsp
          POSTGRES_PASSWORD: dsp
          POSTGRES_DB: dsp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dsp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dsp:dsp@localhost:5432/dsp_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies (hash-locked, как в Docker-образе)
        run: |
          pip install --require-hashes --no-deps --only-binary=:all: -r backend/requirements.lock
          pip install --no-deps ./backend
          pip install pytest pytest-asyncio httpx "fakeredis[lua]" pyyaml
      # requirements.lock должен соответствовать pyproject.toml: расхождение =
      # образ собирается не из того, что объявлено (C6). Сравниваем без hash-строк.
      - name: requirements.lock in sync with pyproject.toml
        working-directory: backend
        run: |
          pip install -q uv
          uv pip compile pyproject.toml --python-version 3.12 --python-platform linux --generate-hashes --no-header -q -o /tmp/requirements.lock
          if ! diff <(grep -vE '^\s*(#|--hash)' requirements.lock) <(grep -vE '^\s*(#|--hash)' /tmp/requirements.lock); then
            echo "::error::backend/requirements.lock is out of date; regenerate per its header comment"; exit 1
          fi
      - name: Apply migrations to a fresh database
        run: python backend/migrate.py
      - name: Migrations are idempotent on re-run
        run: python backend/migrate.py
      - name: Backend imports cleanly
        working-directory: backend
        run: python -c "import main"
      - name: Byte-compile all backend sources
        run: python -m compileall -q backend ops/lib/http_probe.py
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: No broken UTF-8 (U+FFFD) in source
        run: |
          set -o pipefail
          if grep -rIn $'\xEF\xBF\xBD' frontend/app frontend/components frontend/lib backend bidder-go docs ops --include='*.ts' --include='*.tsx' --include='*.py' --include='*.sql' --include='*.go' --include='*.md' --include='*.yml' --include='*.yaml' --include='*.conf' --include='*.sh'; then
            echo "::error::Found U+FFFD replacement characters (broken encoding) in source files above"
            exit 1
          fi
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit
      - name: Unit tests (route handlers, audit S-05)
        working-directory: frontend
        run: pnpm test
      - name: Build
        working-directory: frontend
        run: pnpm run build

  bidder-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bidder-go/go.mod
          cache-dependency-path: bidder-go/go.sum
      - name: Vet
        working-directory: bidder-go
        run: go vet ./...
      - name: Build
        working-directory: bidder-go
        run: go build ./...
      - name: Test
        working-directory: bidder-go
        run: go test ./...

  # Блок G аудита: известные уязвимости в зависимостях всех трёх слоёв.
  # Порог — high/critical (pnpm), любая известная (pip-audit, govulncheck —
  # он показывает только реально вызываемые из нашего кода функции).
  # Audit O-01: compose-топология валидируется на каждом push — dev, production
  # (Caddy/TLS) и managed-БД варианты, Caddyfile и Prometheus-конфиг.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (dev)
        run: docker compose -f compose.yml --env-file .env.example config -q
      - name: docker compose config (dev + monitoring)
        run: |
          docker compose -f compose.yml --env-file .env.example --profile monitoring config --services > /tmp/mon.services
          grep -qx prometheus /tmp/mon.services && grep -qx node-exporter /tmp/mon.services && grep -qx alertmanager /tmp/mon.services
          # Без профиля monitoring ни Prometheus, ни node-exporter (host mounts), ни Alertmanager не стартуют.
          ! docker compose -f compose.yml --env-file .env.example config --services | grep -qxE 'prometheus|node-exporter|alertmanager'
      - name: docker compose config (production)
        run: docker compose -f compose.yml -f compose.prod.yml --env-file .env.example config -q
      - name: docker compose config (managed Postgres/Redis)
        run: |
          grep -v '^POSTGRES_PASSWORD' .env.example > /tmp/env.ext
          cat .env.external.example >> /tmp/env.ext
          docker compose --env-file /tmp/env.ext config -q
          ! docker compose --env-file /tmp/env.ext config --services | grep -qx postgres
      - name: production closes internal ports and dev bind-mount
        run: |
          docker compose -f compose.yml -f compose.prod.yml --env-file .env.example config --format json > /tmp/prod.json
          python3 - <<'PY'
          import json
          s = json.load(open('/tmp/prod.json'))['services']
          for n in ('backend', 'bidder-go', 'frontend'):
              assert not s[n].get('ports'), f'{n} must not publish ports in production'
          assert all(v.get('type') != 'bind' for v in s['backend'].get('volumes', [])), 'backend must not bind-mount source in production'
          assert 'caddy' in s and 'celery' not in open('compose.yml').read()
          PY
      - name: caddy validate
        run: |
          docker run --rm -e DOMAIN=dsp.example.com -e ACME_EMAIL=ops@example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: promtool check config
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3 check config /etc/prometheus/prometheus.yml
      # Unit-тесты правил на сериях с реальными job/instance (audit O-05):
      # ловят правила, которые из-за label mismatch никогда не срабатывают.
      - name: promtool test rules
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3 test rules /etc/prometheus/alerts_test.yml
      - name: drill override renders isolated (own network, own volumes, _ci database)
        env:
          COMPOSE_PROJECT_NAME: centraldsp-ci-config
        run: |
          docker compose -f compose.yml -f ops/tests/compose.ci-drill.yml --env-file ops/tests/drill.env config --format json > /tmp/drill.json
          python3 - <<'PY'
          import json
          c = json.load(open('/tmp/drill.json'))
          assert c['name'] == 'centraldsp-ci-config'
          assert all(v['name'].startswith('centraldsp-ci-config_') for v in c['volumes'].values()), c['volumes']
          assert all(n['name'].startswith('centraldsp-ci-config-') for n in c['networks'].values()), c['networks']
          assert c['services']['postgres']['environment']['POSTGRES_DB'].endswith('_ci')
          assert c['services']['postgres']['ports'][0]['host_ip'] == '127.0.0.1'
          PY
      - name: shellcheck ops scripts
        run: |
          sudo apt-get install -y -q shellcheck >/dev/null
          shellcheck -x -S warning ops/backup.sh ops/restore.sh ops/lib/backup_common.sh ops/tests/backup_restore_drill.sh ops/preprod_check.sh ops/tests/preprod_check_test.sh \
            ops/check_cgroup_limits.sh ops/tests/entrypoint_test.sh ops/tests/uploads_owner_docker.sh ops/tests/integration_smoke.sh
          shellcheck -s sh -S warning backend/docker-entrypoint.sh
      # preprod_check.sh против подставных docker/curl: вердикты, exit codes 0/1/2/3,
      # цепочка NOT TESTED, отсутствие мутирующих команд (аудит O-04).
      - name: preprod_check.sh contract tests
        run: ops/tests/preprod_check_test.sh
      # docker-entrypoint.sh против подставных id/chown/setpriv (C6): чинит владельца
      # только uploads, отказ на symlink и путях вне allowlist, exec через setpriv 10001.
      - name: backend entrypoint contract tests
        run: ops/tests/entrypoint_test.sh
      # compose.limits.yml без LIMIT_* переменных обязан падать, а с ними — рендерить
      # ровно заданные limits (никаких молчаливых default).
      - name: limits overlay is opt-in and fully parameterized
        run: |
          ! docker compose -f compose.yml -f compose.prod.yml -f compose.limits.yml --env-file .env.example config -q 2>/dev/null
          { cat .env.example; printf 'LIMIT_%s_MEM=1G\nLIMIT_%s_CPUS=1.5\n' POSTGRES POSTGRES REDIS REDIS BACKEND BACKEND SCHEDULER SCHEDULER BIDDER BIDDER FRONTEND FRONTEND; } > /tmp/env.limits
          docker compose -f compose.yml -f compose.prod.yml -f compose.limits.yml --env-file /tmp/env.limits config --format json > /tmp/limits.json
          python3 - <<'PY'
          import json
          s = json.load(open('/tmp/limits.json'))['services']
          for n in ('postgres', 'redis', 'backend', 'scheduler', 'bidder-go', 'frontend'):
              lim = s[n]['deploy']['resources']['limits']
              assert lim['memory'] == '1073741824' and lim['cpus'] == '1.5', (n, lim)
              assert s[n]['deploy']['resources']['reservations']['memory'], n
          PY
          # без overlay — только reservations, ни одного hard limit
          docker compose -f compose.yml -f compose.prod.yml --env-file .env.example config --format json > /tmp/nolimits.json
          python3 -c "import json; s=json.load(open('/tmp/nolimits.json'))['services']; assert not any('limits' in v.get('deploy',{}).get('resources',{}) for v in s.values())"

  # Audit O-07 / C6: production-образы реально собираются на каждом push.
  # `compose config` не докажет, что Dockerfile, base image digest, pip
  # --require-hashes, pnpm --frozen-lockfile, go build и multi-stage работают.
  # Без registry push: образы уходят артефактом в container-smoke / integration.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          tags: centraldsp/backend:local
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          tags: centraldsp/frontend:local
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Build bidder-go image
        uses: docker/build-push-action@v6
        with:
          context: bidder-go
          tags: centraldsp/bidder-go:local
          load: true
          cache-from: type=gha,scope=bidder-go
          cache-to: type=gha,scope=bidder-go,mode=max
      - name: Images contain no build secrets or .env
        run: |
          for img in centraldsp/backend:local centraldsp/frontend:local; do
            if docker run --rm --entrypoint sh "$img" -c 'ls -a /app | grep -E "^\.env"' 2>/dev/null; then
              echo "::error::$img contains a .env file"; exit 1
            fi
          done
      - name: Save images as artifact
        run: docker save centraldsp/backend:local centraldsp/frontend:local centraldsp/bidder-go:local | gzip -1 > /tmp/centraldsp-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: centraldsp-images
          path: /tmp/centraldsp-images.tar.gz
          retention-days: 1

  # Каждый образ запускается сам по себе: non-root runtime, health endpoint,
  # healthcheck-команда существует в образе, entrypoint переживает legacy
  # root-owned uploads volume и не запускает приложение от root.
  container-smoke:
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: centraldsp-images
          path: /tmp
      - run: docker load < /tmp/centraldsp-images.tar.gz
      - name: "backend: uploads volume ownership + privilege drop (real Docker)"
        run: ops/tests/uploads_owner_docker.sh
      - name: "backend: image starts, /health answers, PID 1 is uid 10001"
        run: |
          cid=$(docker run -d -e DATABASE_URL=postgresql://x:x@127.0.0.1:1/x -e REDIS_URL=redis://127.0.0.1:1/0 -e SESSION_SECRET=ci-smoke-secret-not-production-0000000000 \
            centraldsp/backend:local sh -c 'exec uvicorn main:app --host 0.0.0.0 --port 8000')
          for i in $(seq 1 30); do
            if docker exec "$cid" setpriv --reuid=10001 --regid=10001 --clear-groups -- python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"; then ok=1; break; fi
            sleep 1
          done
          docker exec "$cid" sh -c 'grep -E "^(Uid|NoNewPrivs):" /proc/1/status'
          docker exec "$cid" sh -c 'test "$(awk "/^Uid:/{print \$2}" /proc/1/status)" = 10001'
          docker logs "$cid" | tail -20; docker rm -f "$cid" >/dev/null
          test "${ok:-0}" = 1
      - name: "frontend: production build served by non-root node"
        run: |
          cid=$(docker run -d -p 127.0.0.1:13000:3000 centraldsp/frontend:local)
          for i in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:13000/ && ok=1 && break; sleep 1; done
          docker exec "$cid" id -u | grep -qx 1000
          docker inspect -f '{{.Config.User}}' "$cid" | grep -qx node
          docker logs "$cid" | tail -10; docker rm -f "$cid" >/dev/null
          test "${ok:-0}" = 1
      - name: "bidder-go: binary starts as nonroot, /livez answers"
        run: |
          cid=$(docker run -d -p 127.0.0.1:18090:8090 -e REDIS_URL=redis://127.0.0.1:1/0 -e BACKEND_URL=http://127.0.0.1:1 -e RTB_API_TOKEN=ci-smoke centraldsp/bidder-go:local)
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:18090/livez && ok=1 && break; sleep 1; done
          docker inspect -f '{{.Config.User}}' "$cid" | grep -qx nonroot
          docker logs "$cid" | tail -10; docker rm -f "$cid" >/dev/null
          test "${ok:-0}" = 1

  # Полный стек из собранных образов: миграции, /ready, upload креатива в
  # заранее root-owned volume, чтение/удаление, bidder /healthz + RTB, graceful stop.
  integration:
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: centraldsp-ci-it-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: centraldsp-images
          path: /tmp
      - run: docker load < /tmp/centraldsp-images.tar.gz
      - name: Integration smoke (compose up --wait, API, uploads, RTB)
        run: ops/tests/integration_smoke.sh
      - name: Upload stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-smoke-logs
          path: /tmp/cdsp-it-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove test stack
        if: always()
        run: docker compose -f compose.yml -f ops/tests/compose.ci-integration.yml --env-file ops/tests/drill.env down -v --remove-orphans || true

  # Disaster-recovery drill (C2 / audit O-02): изолированный compose-проект,
  # migrations -> seed -> backup.sh --with-redis (VERIFY=always) -> проверка
  # manifest/checksums -> negative tests -> down -v -> restore.sh -> независимая
  # финансовая сверка -> tamper -> verification FAILED. Guard внутри скрипта:
  # CENTRALDSP_TEST_MODE=1 и COMPOSE_PROJECT_NAME=centraldsp-ci-*, иначе exit 3
  # до любых destructive действий. Production .env/секреты не читаются.
  backup-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CENTRALDSP_TEST_MODE: "1"
      COMPOSE_PROJECT_NAME: centraldsp-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install drill dependencies (asyncpg for migrate.py / seed)
        run: pip install asyncpg
      - name: Run drill
        run: ops/tests/backup_restore_drill.sh
      - name: Upload drill report (logs, manifest, artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-restore-drill-report
          path: /tmp/cdsp-drill-*/report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove test stack (belt and braces; the drill already does this in its trap)
        if: always()
        run: docker compose -f compose.yml -f ops/tests/compose.ci-drill.yml --env-file ops/tests/drill.env down -v --remove-orphans || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Аудитируем ровно то, что попадает в образ: полный pinned lock, а не
      # только прямые зависимости из pyproject.
      - name: pip-audit (backend requirements.lock — всё, что в образе)
        run: |
          pip install -q pip-audit
          pip-audit --strict --desc off --require-hashes --no-deps -r backend/requirements.lock

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: pnpm audit (frontend prod deps, high+)
        working-directory: frontend
        run: pnpm audit --audit-level high --prod

      - uses: actions/setup-go@v5
        with:
          go-version-file: bidder-go/go.mod
          cache-dependency-path: bidder-go/go.sum
      - name: govulncheck (bidder-go, reachable vulns only)
        working-directory: bidder-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
