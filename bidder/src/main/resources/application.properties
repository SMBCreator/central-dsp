# ============================================================
#  RTB4FREE Bidder — Central DSP configuration
#  Docs: https://github.com/RTB4FREE/bidder
# ============================================================

# ── HTTP Server ─────────────────────────────────────────────
server.port=8080
server.threads=100
# Public endpoint that SSPs send Bid Requests to:
bidder.endpoint=/bidder/ortb
win.url=/bidder/win
loss.url=/bidder/loss

# ── OpenRTB Protocol ────────────────────────────────────────
# Use OpenRTB 2.5 (most SSPs support 2.5)
ortb.version=2.5
# Response timeout in ms — must be < SSP timeout (usually 100-150ms)
bidder.timeout=90

# ── Campaign Source ─────────────────────────────────────────
# Bidder reads active campaigns from Central DSP backend REST API.
# Central DSP backend runs on port 8000 inside Docker network.
campaigns.update.source=REST
campaigns.rest.url=http://backend:8000/api/rtb/campaigns
campaigns.rest.token=${RTB_API_TOKEN:changeme-set-in-env}
# How often to refresh campaigns from backend (seconds)
campaigns.update.interval=30

# ── Win / Loss Notifications ────────────────────────────────
# RTB4FREE will POST win/loss events back to Central DSP bridge.
win.notify.url=http://backend:8000/api/rtb/win-notice
loss.notify.url=http://backend:8000/api/rtb/loss-notice

# ── Redis (shared cache / pub-sub) ──────────────────────────
# Same Redis instance used by Django/Celery.
redis.host=${REDIS_HOST:redis}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
redis.db=1
# Use DB 1 to avoid key collisions with Celery (DB 0)

# ── Frequency Capping ────────────────────────────────────────
# Store impression counters in Redis with TTL.
frequency.cap.enabled=true
frequency.cap.redis.ttl=86400
# Max impressions per user per campaign per 24h
frequency.cap.max=5

# ── Budget Enforcement ───────────────────────────────────────
# Budget checks use daily_budget and total_budget from campaigns API.
# Budget state is stored in Redis for fast in-process checks.
budget.check.enabled=true
budget.redis.prefix=cdsp:budget:

# ── Geo / IP Lookup ──────────────────────────────────────────
# MaxMind GeoLite2 DB path (mounted as Docker volume)
# Download: https://dev.maxmind.com/geoip/geolite2-free-geolocation-data
geo.maxmind.db=/data/GeoLite2-City.mmdb
geo.enabled=true

# ── Targeting ────────────────────────────────────────────────
# Enforce targeting rules (geo, device, OS, site whitelist/blacklist)
targeting.enabled=true
# Max time (ms) for targeting evaluation per impression
targeting.timeout.ms=5

# ── Auction ──────────────────────────────────────────────────
# Second-price auction (standard for RTB)
auction.type=2
# Minimum bid floor when not specified in Bid Request
auction.default.floor=0.01

# ── Logging ──────────────────────────────────────────────────
logging.level=INFO
# Log every 1000th bid request (avoid log spam in prod)
bidder.log.every=1000
# Send structured auction logs to Central DSP (async, batched)
auction.log.enabled=true
auction.log.batch.size=100
auction.log.flush.interval.ms=5000

# ── Metrics (Prometheus) ─────────────────────────────────────
metrics.enabled=true
metrics.port=9090
metrics.path=/metrics
# Key metrics exposed:
#   cdsp_bid_requests_total
#   cdsp_bid_responses_total
#   cdsp_wins_total
#   cdsp_bid_price_histogram
#   cdsp_response_time_ms_histogram

# ── CORS (allow SSP testers) ─────────────────────────────────
cors.enabled=true
cors.allowed.origins=*

# ── Health Check ─────────────────────────────────────────────
health.endpoint=/health
