# =========================================================
# Central DSP — Java Bidder configuration
# All values can be overridden by environment variables.
# Spring Boot env var convention: key.sub-key -> KEY_SUB_KEY
# =========================================================

spring.application.name=central-dsp-bidder
server.port=8080

# ----- Tomcat thread pool -----
# High thread count for RTB latency: each bid request must
# complete within ~100ms, so threads block briefly on Redis.
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=5000

# ----- Redis -----
redis.host=${REDIS_HOST:redis}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
redis.db=${REDIS_DB:1}

# ----- Frequency cap -----
fcap.window.hours=${FCAP_WINDOW_HOURS:24}
fcap.default.limit=${FCAP_DEFAULT_LIMIT:10}

# ----- Backend API -----
backend.url=${BACKEND_URL:http://backend:8000}
backend.api.token=${BACKEND_API_TOKEN:}

# ----- Campaign loader -----
# Refresh interval in seconds. Lower = fresher data, more backend load.
campaigns.update.interval=${CAMPAIGNS_UPDATE_INTERVAL:30}

# ----- Bidder behaviour -----
# Maximum bid price in CPM USD (hard ceiling for all campaigns).
bidder.max.bid.price=${BIDDER_MAX_BID_PRICE:50.0}
# Bid response timeout budget in ms (informational; Tomcat enforces via connection-timeout).
bidder.timeout.ms=${BIDDER_TIMEOUT_MS:100}
# Win notice URL template. {AUCTION_PRICE} is filled by SSP.
bidder.win.url=${BIDDER_EXTERNAL_URL:http://bidder:8080}/bidder/win

# ----- CORS -----
cors.enabled=true
cors.allowed.origins=*

# ----- Actuator -----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ----- Logging -----
logging.level.io.centraldsp=INFO
logging.level.io.centraldsp.bidder.service.BidEngineService=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
